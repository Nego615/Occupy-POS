<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Occupy POS — Edit Item</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#121212; --ink-soft:#63615c; --paper:#ffffff;
    --surface:#f5f4f1; --surface-hover:#eeece6; --line:#e4e2dc;
    --occupied:#ff4b2e; --open:#1fae5c;
    --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}

  .app{display:grid;grid-template-rows:auto 1fr;height:100vh;min-height:640px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid var(--line);}
  .topbar-left{display:flex;align-items:center;gap:14px;}
  .back{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;}
  .back:hover{background:var(--surface);}
  .topbar-title{font-size:15px;font-weight:700;}
  .topbar-sub{font-size:12px;color:var(--ink-soft);}
  .topbar-actions{display:flex;gap:10px;}
  .btn-secondary{padding:10px 16px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--paper);font-weight:700;font-size:13.5px;font-family:inherit;cursor:pointer;}
  .btn-secondary:hover{background:var(--surface);}
  .btn-primary{padding:10px 18px;border-radius:var(--radius-sm);border:none;background:var(--ink);color:var(--paper);font-weight:700;font-size:13.5px;font-family:inherit;cursor:pointer;}
  .btn-primary:hover{opacity:.88;}

  .body{display:grid;grid-template-columns:1fr 320px;min-height:0;}

  .form-col{padding:28px;overflow-y:auto;max-width:560px;}
  .field{margin-bottom:22px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.03em;}
  .field input[type=text], .field textarea{
    width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:12px 14px;font-family:inherit;font-size:14px;color:var(--ink);background:var(--paper);
  }
  .field textarea{resize:vertical;min-height:72px;}
  .price-input{
    display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:12px 14px;gap:4px;
  }
  .price-input span{color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .price-input input{border:none;outline:none;font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;width:100%;font-variant-numeric:tabular-nums;}

  .pill-row{display:flex;gap:8px;flex-wrap:wrap;}
  .pill{border:1px solid var(--line);background:var(--paper);padding:9px 16px;border-radius:100px;font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .pill.active{background:var(--ink);border-color:var(--ink);color:var(--paper);}

  .swatch-row{display:flex;gap:10px;flex-wrap:wrap;}
  .swatch{width:32px;height:32px;border-radius:9px;cursor:pointer;border:2px solid transparent;position:relative;}
  .swatch.active::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line);}
  .toggle-label{font-size:14px;font-weight:600;}
  .toggle-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .switch{width:42px;height:24px;border-radius:100px;background:var(--open);position:relative;cursor:pointer;flex-shrink:0;}
  .switch::after{content:"";position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:var(--paper);}

  /* ---- Preview col ---- */
  .preview-col{border-left:1px solid var(--line);background:var(--surface);padding:28px 22px;}
  .preview-label{font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.03em;margin-bottom:14px;}
  .preview-tile{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:16px 14px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;
    max-width:180px;
  }
  .preview-dot{width:26px;height:26px;border-radius:8px;margin-bottom:10px;background:#1fae5c;}
  .preview-name{font-size:14px;font-weight:600;}
  .preview-price{font-size:13px;color:var(--ink-soft);margin-top:8px;}
  .preview-note{font-size:12.5px;color:var(--ink-soft);margin-top:16px;line-height:1.5;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-left">
      <div class="back">←</div>
      <div>
        <div class="topbar-title">Edit item</div>
        <div class="topbar-sub">Coffee catalog</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="btn-secondary">Discard</button>
      <button class="btn-primary">Save item</button>
    </div>
  </div>

  <div class="body">
    <div class="form-col">
      <div class="field">
        <label>Item name</label>
        <input type="text" value="Oat Latte">
      </div>

      <div class="field">
        <label>Price</label>
        <div class="price-input"><span>$</span><input type="text" value="5.25"></div>
      </div>

      <div class="field">
        <label>Category</label>
        <div class="pill-row">
          <div class="pill active">Coffee</div>
          <div class="pill">Food</div>
          <div class="pill">Pastries</div>
          <div class="pill">Retail</div>
        </div>
      </div>

      <div class="field">
        <label>Tile color</label>
        <div class="swatch-row">
          <div class="swatch" style="background:#ff4b2e"></div>
          <div class="swatch" style="background:#8a5cf6"></div>
          <div class="swatch active" style="background:#1fae5c"></div>
          <div class="swatch" style="background:#0e7bd6"></div>
          <div class="swatch" style="background:#e0a300"></div>
          <div class="swatch" style="background:#121212"></div>
        </div>
      </div>

      <div class="field">
        <label>Description <span style="text-transform:none;font-weight:400;">(optional)</span></label>
        <textarea>Espresso, steamed oat milk, light foam.</textarea>
      </div>

      <div class="toggle-row">
        <div>
          <div class="toggle-label">Available for sale</div>
          <div class="toggle-sub">Shows on the register grid immediately</div>
        </div>
        <div class="switch"></div>
      </div>
      <div class="toggle-row">
        <div>
          <div class="toggle-label">Track stock</div>
          <div class="toggle-sub">Warn when fewer than 5 remain</div>
        </div>
        <div class="switch" style="background:var(--line)"></div>
      </div>
    </div>

    <div class="preview-col">
      <div class="preview-label">Live preview</div>
      <div class="preview-tile">
        <div class="preview-dot"></div>
        <div class="preview-name">Oat Latte</div>
        <div class="preview-price mono">$5.25</div>
      </div>
      <div class="preview-note">This is exactly how the item will appear on the register grid — changes update here as you type.</div>
    </div>
  </div>
</div>
</body>
</html>
