<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="240" height="140" class="scarab" role="img" aria-label="A scarab beetle rolling a ball">
  <style>
    .scarab {
      --scarab-ink: var(--ink, #121212);
      --scarab-ink-far: var(--ink-soft, #63615c);
      --scarab-ball: #b3a288;
      --scarab-ball-shade: #9c8a6e;
      --scarab-ball-grain: #83725a;
      --scarab-ground: var(--line, #e4e2dc);
      --scarab-speed: 4s; /* one full turn of the ball */
      overflow: visible;
    }
    .scarab * { transform-box: view-box; }

    /* Ground: the dashes and soil specks slide left, so the pair travels right. */
    .scarab__ground { animation: scarab-dash calc(var(--scarab-speed) * 0.08) linear infinite; }
    .scarab__soil { animation: scarab-soil calc(var(--scarab-speed) * 1.2) linear infinite; }

    /* Ball: rolls clockwise; one turn covers its circumference (~195 units). */
    .scarab__grain { animation: scarab-roll var(--scarab-speed) linear infinite; }

    /* Beetle: a small bob on every step, legs in a tripod gait. */
    .scarab__bob { animation: scarab-bob calc(var(--scarab-speed) * 0.15) ease-in-out infinite alternate; }
    .scarab__leg { animation: scarab-step calc(var(--scarab-speed) * 0.15) ease-in-out infinite alternate; }
    .scarab__leg--b { animation-delay: calc(var(--scarab-speed) * -0.15); }
    .scarab__leg--push { animation-name: scarab-push; }

    @keyframes scarab-dash { to { stroke-dashoffset: 16; } }
    @keyframes scarab-soil { to { transform: translateX(-240px); } }
    @keyframes scarab-roll { to { transform: rotate(360deg); } }
    @keyframes scarab-bob  { from { transform: translateY(0); } to { transform: translateY(-1.2px); } }
    @keyframes scarab-step { from { transform: rotate(-11deg); } to { transform: rotate(11deg); } }
    @keyframes scarab-push { from { transform: rotate(-6deg); } to { transform: rotate(7deg); } }

    @media (prefers-reduced-motion: reduce) {
      .scarab * { animation: none !important; }
    }
  </style>

  <!-- Ground -->
  <line class="scarab__ground" x1="0" y1="119" x2="240" y2="119" stroke="var(--scarab-ground)" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 6" />
  <g fill="var(--scarab-ground)">
    <g class="scarab__soil">
      <circle cx="12" cy="125" r="1.4" /><circle cx="46" cy="129" r="1" /><circle cx="78" cy="124.5" r="1.8" />
      <circle cx="118" cy="128" r="1.2" /><circle cx="150" cy="125" r="1" /><circle cx="186" cy="129.5" r="1.6" />
      <circle cx="222" cy="125.5" r="1.2" />
      <circle cx="252" cy="125" r="1.4" /><circle cx="286" cy="129" r="1" /><circle cx="318" cy="124.5" r="1.8" />
      <circle cx="358" cy="128" r="1.2" /><circle cx="390" cy="125" r="1" /><circle cx="426" cy="129.5" r="1.6" />
      <circle cx="462" cy="125.5" r="1.2" />
    </g>
  </g>

  <!-- Dung ball -->
  <g transform="translate(152 92)">
    <circle r="26" fill="var(--scarab-ball)" />
    <g class="scarab__grain" fill="none" stroke="var(--scarab-ball-grain)" stroke-width="1.8" stroke-linecap="round">
      <path d="M-12 -15 q4 -3.5 8.5 -1.7" />
      <path d="M5 -20 q5 1 7.5 5" />
      <path d="M12 2 q3.4 4 1.7 9" />
      <path d="M-17 5 q1 5 5 7.5" />
      <path d="M-2 10 q4 1.7 7 0" />
      <path d="M-3.4 -3.4 q2.5 -2.5 6 -1" />
      <circle cx="17" cy="-8.5" r="1.2" fill="var(--scarab-ball-grain)" stroke="none" />
      <circle cx="-18.5" cy="-5" r="1.2" fill="var(--scarab-ball-grain)" stroke="none" />
      <circle cx="3.4" cy="20" r="1.2" fill="var(--scarab-ball-grain)" stroke="none" />
    </g>
    <!-- flat shade, stays put while the grain turns -->
    <path d="M18.4 -18.4 A26 26 0 0 1 -18.4 18.4 A30 30 0 0 0 18.4 -18.4 Z" fill="var(--scarab-ball-shade)" opacity="0.6" />
  </g>

  <!-- Scarab, head down, walking backwards and pushing with its hind legs -->
  <g class="scarab__bob">
    <g transform="translate(105.4 90) rotate(-28) scale(1.25)" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- far-side legs (softer ink, opposite phase) -->
      <g stroke="var(--scarab-ink-far)" stroke-width="2.2">
        <g transform="translate(-12 6)"><g class="scarab__leg scarab__leg--b"><path d="M0 0 L-1 8 L-9 6" /></g></g>
        <g transform="translate(0 7)"><g class="scarab__leg"><path d="M0 0 L11 7 L9 16" /></g></g>
        <g transform="translate(13 7)"><g class="scarab__leg scarab__leg--push scarab__leg--b"><path d="M0 0 L-5 8 L1.5 12" /></g></g>
      </g>

      <!-- body -->
      <g fill="var(--scarab-ink)" stroke="none">
        <!-- clypeus (the shovel head) -->
        <path d="M-21 -5 L-29 -3 L-33 0 L-31 2 L-34.5 4.5 L-31 6 L-33 9 L-27 9 L-21 7 Z" />
        <!-- pronotum -->
        <ellipse cx="-14" cy="1" rx="9.5" ry="9.5" />
        <!-- elytra -->
        <path d="M-6 7 C-8 -13 21 -16 28.5 -2 C30 5 25 8.5 17 8.5 Z" />
      </g>
      <!-- elytra seam + sheen -->
      <path d="M-4.5 -1 C2 -9.5 14 -10.5 22.5 -4.5" stroke="var(--paper, #fff)" stroke-opacity="0.22" stroke-width="1.2" />
      <path d="M-7 -1.5 L-6 5.5" stroke="var(--paper, #fff)" stroke-opacity="0.22" stroke-width="1" />
      <!-- antenna -->
      <path d="M-25 -3 L-28 -8.5" stroke="var(--scarab-ink)" stroke-width="1.3" />
      <circle cx="-28.6" cy="-9.6" r="1.6" fill="var(--scarab-ink)" stroke="none" />

      <!-- near-side legs -->
      <g stroke="var(--scarab-ink)" stroke-width="2.4">
        <g transform="translate(-16 8)"><g class="scarab__leg"><path d="M0 0 L-2 8 L-10 4" /></g></g>
        <g transform="translate(-4 9)"><g class="scarab__leg scarab__leg--b"><path d="M0 0 L10 8 L6 15.5" /></g></g>
        <!-- hind leg raised up over the back and planted on the ball -->
        <g transform="translate(18 4)"><g class="scarab__leg scarab__leg--push"><path d="M0 0 L6 -20 L13 -6" /></g></g>
      </g>
    </g>
  </g>
</svg>
