<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Occupy POS — Tender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#121212; --ink-soft:#63615c; --paper:#ffffff;
    --surface:#f5f4f1; --surface-hover:#eeece6; --line:#e4e2dc;
    --occupied:#ff4b2e; --occupied-soft:#fff0ec;
    --open:#1fae5c; --open-soft:#eafaf1;
    --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}

  .app{display:flex;flex-direction:column;height:100vh;min-height:640px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--line);flex-shrink:0;}
  .topbar-left{display:flex;align-items:center;gap:12px;}
  .close{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;}
  .close:hover{background:var(--surface);}
  .topbar-title{font-size:14px;font-weight:700;}
  .status-chip{display:inline-flex;align-items:center;gap:7px;background:var(--occupied-soft);color:var(--occupied);font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:100px;}
  .status-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--occupied);}

  .center{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;gap:0;
  }
  .receipt-edge{width:340px;height:14px;background:radial-gradient(circle at 10px 0, transparent 6px, var(--paper) 6.5px) top, var(--surface);background-size:20px 14px;background-repeat:repeat-x;border-bottom:1px dashed var(--line);}
  .card{
    width:340px;background:var(--surface);border:1px solid var(--line);border-top:none;
    border-radius:0 0 var(--radius-lg) var(--radius-lg);padding:28px 26px 26px;text-align:center;
  }
  .total-label{font-size:12.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.04em;font-weight:700;}
  .total-amount{font-size:44px;font-weight:700;margin-top:8px;line-height:1;}

  .tip-row{display:flex;gap:8px;justify-content:center;margin-top:26px;}
  .tip-pill{
    flex:1;border:1px solid var(--line);background:var(--paper);border-radius:var(--radius-sm);
    padding:12px 6px;cursor:pointer;text-align:center;
  }
  .tip-pill.active{background:var(--ink);border-color:var(--ink);}
  .tip-pill.active .tip-pct, .tip-pill.active .tip-amt{color:var(--paper);}
  .tip-pct{font-size:14px;font-weight:700;}
  .tip-amt{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

  .new-total{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:14px;}
  .new-total .label{color:var(--ink-soft);}
  .new-total .value{font-weight:700;}

  .method-row{display:flex;gap:10px;margin-top:22px;}
  .method{
    flex:1;border:1px solid var(--line);background:var(--paper);border-radius:var(--radius-sm);
    padding:14px 8px;text-align:center;cursor:pointer;font-size:12.5px;font-weight:700;
  }
  .method.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .method-icon{font-size:18px;display:block;margin-bottom:6px;}

  .footer{padding:20px 28px 26px;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:10px;flex-shrink:0;}
  .charge-btn{
    width:340px;background:var(--ink);color:var(--paper);border:none;border-radius:var(--radius-sm);
    padding:18px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;
  }
  .charge-btn:hover{opacity:.88;}
  .cancel-link{font-size:13px;color:var(--ink-soft);cursor:pointer;background:none;border:none;font-family:inherit;}
  .cancel-link:hover{color:var(--ink);}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-left">
      <div class="close">×</div>
      <div class="topbar-title">Table 4 · #1046</div>
    </div>
    <span class="status-chip"><span class="dot"></span>Awaiting payment</span>
  </div>

  <div class="center">
    <div class="receipt-edge"></div>
    <div class="card">
      <div class="total-label">Amount due</div>
      <div class="total-amount mono">$19.85</div>

      <div class="tip-row" id="tipRow"></div>

      <div class="new-total">
        <span class="label">Total with tip</span>
        <span class="value mono" id="newTotal">$23.82</span>
      </div>

      <div class="method-row">
        <div class="method active"><span class="method-icon">▭</span>Card</div>
        <div class="method"><span class="method-icon">$</span>Cash</div>
        <div class="method"><span class="method-icon">⇆</span>Split</div>
      </div>
    </div>
  </div>

  <div class="footer">
    <button class="charge-btn">Charge <span class="mono">$23.82</span></button>
    <button class="cancel-link">Cancel and return to register</button>
  </div>
</div>

<script>
const tips = [
  {pct:"15%", amt:"$2.98"},
  {pct:"18%", amt:"$3.57", active:true},
  {pct:"20%", amt:"$3.97"},
  {pct:"Custom", amt:""},
];
document.getElementById('tipRow').innerHTML = tips.map(t => `
  <div class="tip-pill ${t.active?'active':''}">
    <div class="tip-pct">${t.pct}</div>
    ${t.amt ? `<div class="tip-amt mono">${t.amt}</div>` : '<div class="tip-amt">enter amount</div>'}
  </div>
`).join('');
</script>
</body>
</html>
